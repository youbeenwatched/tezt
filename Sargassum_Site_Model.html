<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<title>Project SIREN — Antigua Sargassum-to-Value Facility</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;450&display=swap">
<style>
  :root{
    --ink:#ffffff;
    --body-ink:#eee8e0;
    --label:#cabfb4;
    --accent:#3aa997;
    --display:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
    --body:"IBM Plex Sans","Helvetica Neue",Helvetica,Arial,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  html,body{height:100%;}
  body{margin:0;background:#101619;overflow:hidden;font-family:var(--body);color:var(--ink);}
  #stage{position:fixed;inset:0;}
  canvas{display:block;width:100%;height:100%;}

  #scrim{position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(72% 56% at 0% 100%, rgba(255,255,255,.82), rgba(255,255,255,0) 70%),
      radial-gradient(56% 34% at 100% 0%, rgba(255,255,255,.78), rgba(255,255,255,0) 70%),
      radial-gradient(46% 26% at 0% 0%,   rgba(255,255,255,.72), rgba(255,255,255,0) 74%),
      linear-gradient(180deg, rgba(255,255,255,.42), rgba(255,255,255,0) 16%);}

  #ui{position:fixed;inset:0;pointer-events:none;color:var(--ink);}

  .mark{position:absolute;top:clamp(18px,3.4vh,36px);left:clamp(20px,3vw,46px);}
  .mark img{display:block;height:clamp(22px,2.5vw,34px);width:auto;min-width:80px;}
  .mark span{display:block;margin-top:.62em;font-family:var(--body);font-weight:400;
    font-size:clamp(10px,1.02vw,13.5px);letter-spacing:.03em;color:var(--body-ink);}

  .mark{--lgh:clamp(20px,2.1vw,29px);
    display:flex;align-items:center;gap:clamp(12px,1.5vw,21px);
    background:rgba(246,244,238,.96);border-radius:10px;
    padding:clamp(9px,1.0vw,13px) clamp(13px,1.5vw,20px);
    box-shadow:0 12px 34px rgba(0,0,0,.38);}
  .mark img{display:block;width:auto;min-width:0;}
  .mark i{width:1px;height:calc(var(--lgh) * 1.34);background:rgba(24,16,28,.17);}
  @media (max-width: 760px){ .mark{--lgh:17px;gap:10px;padding:7px 11px;border-radius:8px;} }
  #plate{position:absolute;top:clamp(18px,3.4vh,36px);right:clamp(20px,3vw,46px);
    text-align:right;line-height:1.62;}
  #plate b{display:block;font-family:var(--display);font-weight:500;
    font-size:clamp(12px,1.28vw,17px);letter-spacing:.005em;color:var(--ink);}
  #plate span{display:block;font-family:var(--mono);font-size:clamp(8.5px,.84vw,11px);
    letter-spacing:.06em;color:var(--label);font-variant-numeric:tabular-nums;}

  #cap{position:absolute;left:clamp(20px,3vw,46px);bottom:clamp(22px,4vh,42px);
    max-width:min(620px,58vw);}
  #cap .rule{width:44px;height:2px;background:#c0231a;margin-bottom:1.1em;
    transform-origin:left;}
  #cap.on .rule{animation:rule .9s cubic-bezier(.2,.7,.2,1) both;}
  @keyframes rule{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  #cap h2{margin:0 0 .5em;font-family:var(--display);font-weight:500;
    font-size:clamp(20px,2.7vw,37px);text-wrap:balance;line-height:1.11;
    letter-spacing:-.01em;color:var(--ink);}
  #cap p{margin:0;font-size:clamp(11.5px,1.16vw,15px);line-height:1.62;color:var(--body-ink);
    max-width:54ch;}

  .fade{transition:opacity .9s ease, transform .9s cubic-bezier(.2,.7,.2,1);}
  .out{opacity:0;transform:translateY(10px);}
  .in{opacity:1;transform:translateY(0);}

  #bar{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(14,21,24,.09);}
  #bar i{display:block;height:100%;width:0%;background:var(--accent);opacity:.85;}

  /* ---- mode switching ---- */
  body.mode-tour #panel, body.mode-tour #chips, body.mode-tour #tools, body.mode-tour #hint{display:none;}
  body.mode-explore #cap, body.mode-explore #bar, body.mode-explore #toExplore{display:none;}

  #veil{position:fixed;inset:0;background:#e6eae9;opacity:0;pointer-events:none;
    transition:opacity .3s ease;z-index:5;}
  #veil.on{opacity:1;}

  #toExplore{position:absolute;right:clamp(16px,3vw,44px);bottom:clamp(22px,4vh,42px);
    pointer-events:auto;border:1px solid rgba(14,21,24,.16);border-radius:2em;
    background:rgba(255,255,255,.90);color:var(--ink);
    font-family:var(--body);font-size:clamp(12px,1.08vw,15px);
    padding:.85em 1.5em;cursor:pointer;
    box-shadow:0 8px 26px rgba(14,21,24,.14);
    transition:background .2s ease,transform .15s ease;}
  #toExplore:hover{background:#fff;}
  #toExplore:active{transform:scale(.97);}
  #toTour{background:rgba(192,35,26,.92) !important;border-color:#c0231a !important;color:#fff !important;}

  /* ---- kiosk ---- */
  html,body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;}
  canvas{touch-action:none;}

  #hint{position:absolute;left:50%;transform:translateX(-50%);
    bottom:clamp(104px,15vh,150px);font-family:var(--mono);
    font-size:clamp(10px,1.05vw,13px);letter-spacing:.12em;text-transform:uppercase;
    color:var(--label);background:rgba(255,255,255,.72);padding:.7em 1.2em;border-radius:2em;
    transition:opacity .6s ease;}
  #hint.gone{opacity:0;}

  #panel{position:absolute;left:clamp(16px,3vw,44px);bottom:clamp(92px,13vh,128px);
    width:min(430px,calc(100vw - 32px));background:rgba(255,255,255,.93);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(14,21,24,.10);border-radius:14px;
    padding:clamp(18px,2.4vw,26px);pointer-events:auto;
    box-shadow:0 18px 48px rgba(14,21,24,.16);
    transition:opacity .32s ease, transform .32s cubic-bezier(.2,.7,.2,1);}
  #panel.off{opacity:0;transform:translateY(14px);pointer-events:none;}
  #panel .rule{width:40px;height:2px;background:#c0231a;margin-bottom:1em;}
  #panel span{display:block;font-family:var(--mono);font-size:clamp(9px,.86vw,11px);
    letter-spacing:.19em;text-transform:uppercase;color:#c0231a;margin-bottom:.55em;}
  #panel h2{margin:0 0 .5em;font-family:var(--display);font-weight:500;
    font-size:clamp(19px,2.1vw,27px);line-height:1.14;letter-spacing:-.008em;color:var(--ink);}
  #panel p{margin:0;font-size:clamp(12.5px,1.05vw,15px);line-height:1.62;color:var(--body-ink);}
  #close{position:absolute;top:10px;right:12px;width:34px;height:34px;border:0;border-radius:50%;
    background:transparent;color:var(--label);font-size:24px;line-height:1;cursor:pointer;
    pointer-events:auto;}
  #close:hover{background:rgba(14,21,24,.06);color:var(--ink);}

  #chips{position:absolute;left:0;right:0;bottom:clamp(16px,2.6vh,30px);
    display:flex;gap:8px;padding:0 clamp(16px,3vw,44px);
    overflow-x:auto;overflow-y:hidden;pointer-events:auto;
    scrollbar-width:none;-ms-overflow-style:none;}
  #chips::-webkit-scrollbar{display:none;}
  #chips button{flex:0 0 auto;border:1px solid rgba(14,21,24,.14);border-radius:2em;
    background:rgba(255,255,255,.82);color:var(--body-ink);
    font-family:var(--body);font-size:clamp(11.5px,1.02vw,14px);
    padding:.62em 1.1em;cursor:pointer;white-space:nowrap;
    transition:background .2s ease,color .2s ease,border-color .2s ease;}
  #chips button:active{transform:scale(.97);}
  #chips button.on{background:#c0231a;border-color:#c0231a;color:#fff;}

  #tools{position:absolute;right:clamp(16px,3vw,44px);bottom:clamp(92px,13vh,128px);
    display:flex;flex-direction:column;gap:8px;pointer-events:auto;}
  #tools button{border:1px solid rgba(14,21,24,.14);border-radius:9px;
    background:rgba(255,255,255,.86);color:var(--body-ink);
    font-family:var(--mono);font-size:clamp(9.5px,.86vw,11.5px);letter-spacing:.11em;
    text-transform:uppercase;padding:.72em 1em;cursor:pointer;}
  #tools button:active{transform:scale(.97);}

  @media (max-width: 760px){
    #panel{left:12px;right:12px;width:auto;bottom:78px;}
    #tools{bottom:auto;top:calc(clamp(18px,3.4vh,36px) + 62px);right:12px;flex-direction:row;}
    #plate{display:none;}
    #hint{bottom:150px;}
  }

  #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;background:#e6eae9;color:var(--label);font-family:var(--mono);
    font-size:12px;letter-spacing:.22em;text-transform:uppercase;transition:opacity .7s ease;}
  #boot.gone{opacity:0;pointer-events:none;}
  #boot small{display:block;margin-top:10px;letter-spacing:.04em;text-transform:none;
    font-size:11px;color:var(--body-ink);max-width:420px;text-align:center;line-height:1.6}

  /* ---- dusk: the overlay inverts, or none of this reads over a dark scene ---- */
  #scrim{background:
      radial-gradient(78% 62% at 0% 100%, rgba(8,13,17,.72), rgba(8,13,17,0) 72%),
      radial-gradient(60% 40% at 100% 0%, rgba(8,13,17,.58), rgba(8,13,17,0) 72%),
      radial-gradient(52% 30% at 0% 0%,   rgba(8,13,17,.52), rgba(8,13,17,0) 76%),
      linear-gradient(0deg, rgba(8,13,17,.46), rgba(8,13,17,0) 22%);}
  #bar{background:rgba(244,236,224,.12);}
  #veil{background:#101619;}
  #boot{background:#101619;}
  #toExplore{border:1px solid rgba(244,236,224,.20);background:rgba(20,29,35,.86);
    color:var(--ink);box-shadow:0 10px 34px rgba(0,0,0,.46);
    backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);}
  #toExplore:hover{background:rgba(46,35,54,.94);}
  #toTour{background:rgba(10,140,124,.96) !important;border-color:#0a8c7c !important;
    color:#f2fbf8 !important;}
  #hint{color:var(--label);background:rgba(20,29,35,.66);}
  #panel{background:rgba(26,20,32,.90);border:1px solid rgba(244,236,224,.14);
    box-shadow:0 22px 60px rgba(0,0,0,.56);}
  #panel .rule{background:#3aa997;}
  #panel span{color:#4fbeab;}
  #close{color:var(--label);}
  #close:hover{background:rgba(244,236,224,.10);color:var(--ink);}
  #chips button{border:1px solid rgba(244,236,224,.18);background:rgba(20,29,35,.76);
    color:var(--body-ink);}
  #chips button.on{background:#ff7a1a;border-color:#ff7a1a;color:#1e1e1e;}
  #tools button{border:1px solid rgba(244,236,224,.18);background:rgba(20,29,35,.78);
    color:var(--body-ink);}
  #cap .rule{background:#3aa997;}

  /* the sky behind the plate is the brightest thing on screen at dusk, and the
     caption sits over open water — both need the text carried, not tinted */
  #cap h2, #cap p, #plate b, #plate span, .mark + #plate, #hint{
    text-shadow:0 1px 2px rgba(3,7,10,.95), 0 2px 18px rgba(3,7,10,.85);}
  #plate span{font-size:clamp(9.5px,.92vw,12.5px);color:#ece3d6;}
  #plate b{font-size:clamp(13px,1.38vw,18.5px);}
  #cap p{color:var(--body-ink);}
  #scrim{background:
      radial-gradient(80% 64% at 0% 100%, rgba(8,5,12,.80), rgba(8,5,12,0) 74%),
      radial-gradient(64% 44% at 100% 0%, rgba(8,5,12,.70), rgba(8,5,12,0) 74%),
      radial-gradient(54% 32% at 0% 0%,   rgba(8,5,12,.44), rgba(8,5,12,0) 78%),
      linear-gradient(0deg, rgba(8,5,12,.50), rgba(8,5,12,0) 24%);}

</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="scrim"></div>

<div id="ui">
  <div class="mark">
    
  </div>

  <div id="plate">
    <b></b>
    <span></span>
    <span></span>
  </div>

  <div id="cap" class="fade out">
    <div class="rule"></div>
    <h2 id="capH"></h2>
    <p id="capP"></p>
  </div>
  <div id="bar"><i id="barI"></i></div>

  <div id="hint">Drag to spin &middot; Pinch to zoom &middot; Tap a unit</div>
  <button id="toExplore">Explore the plant &rarr;</button>

  <div id="panel" class="off">
    <button id="close" aria-label="Close">&times;</button>
    <div class="rule"></div>
    <span id="pKick"></span>
    <h2 id="pName"></h2>
    <p id="pBody"></p>
  </div>

  <div id="chips"></div>

  <div id="tools">
    <button id="toTour">&#9654;&nbsp; Play the film</button>
    <button id="reset">Reset view</button>
    <button id="full">Full screen</button>
  </div>
</div>

<div id="veil"></div>
<div id="boot">Loading<small id="bootMsg"></small></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>if(typeof THREE==="undefined"){document.write('<scr'+'ipt src="three.min.js"><\/scr'+'ipt>');}</script>
<script>
(function(){
"use strict";
var boot = document.getElementById('boot'), bootMsg = document.getElementById('bootMsg');
if (typeof THREE === 'undefined'){
  bootMsg.textContent = 'The 3D library could not be loaded. Check the network connection and reload.';
  return;
}

/* ============================================================
   3D SITE MODEL TEMPLATE
   ------------------------------------------------------------
   A single self-contained page that renders an industrial site
   two ways from one scene:

     FILM     a looping 45-degree orbit that flies in from the
              distance, visits each unit in process order and
              captions it.
     EXPLORER touch orbit, pinch zoom, two-finger pan, and tap
              a unit to highlight it and read about it.

   Buttons move between the two. Left alone for 45 s the
   explorer hands the stand back to the film, so it survives
   unattended on a trade-show tablet.

   WHAT TO EDIT, IN ORDER
     1. BRAND     - name, tagline, plate text, accent colours
     2. THE SITE  - your geometry, using the kit below
     3. THE UNITS - one table drives captions, chips and panels

   THE KIT (all documented in the accompanying home base doc)
     vessel(x,z,d,h,mat,opt)        vertical vessel + heads + skirt
     drum(x,y,z,d,len,mat,rotY)     horizontal drum / exchanger
     storageTank(x,z,d,h,shell,band) tank + wordmark on two faces
     bund(cx,cz,w,d)                bunded enclosure
     rack(axis,fixed,from,to,tiers) shared pipe rack with bents
     run(a,b,y,r,mat,via)           pipe THAT CARRIES ITSELF
     pipe(points,r,mat)             free polyline (add posts!)
     post(x,z,y,axis)               one support to grade
     stairTower(x,z,levels,w)       switchback stair + landings
     buildVehicle(spec,paint)       car / pickup / SUV / van
     beginUnit(name) ... endUnit()  everything inside is tappable

   THREE RULES LEARNED THE HARD WAY
     - Never draw a pipe without supports. Use run(), not pipe().
     - Cross-plot lines take a clear CORRIDOR via the 6th argument
       of run(); routing point-to-point puts posts inside vessels.
     - Metals need scene.environment or they render nearly black.
   ============================================================ */

var canvas = document.getElementById('c');
var renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.16;

var scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x3b4a52, 620, 2600);
var camera = new THREE.PerspectiveCamera(36, 1, 3.4, 4100);   // a larger near buys depth precision

var skyMat;
(function(){ // sky
  var m = skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite:false, fog:false,
    uniforms:{ top:{value:new THREE.Color(0x121d33)}, mid:{value:new THREE.Color(0x3f5f6e)}, bot:{value:new THREE.Color(0xdd8a5a)} },
    vertexShader:'varying float h; void main(){ vec4 wp = modelMatrix*vec4(position,1.0); h = normalize(wp.xyz).y; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader:'varying float h; uniform vec3 top; uniform vec3 mid; uniform vec3 bot; void main(){ float t=clamp(h,-1.0,1.0); vec3 c = t>0.0 ? mix(mid,top,pow(t,0.60)) : mix(mid,bot,pow(-t,0.5)); gl_FragColor=vec4(c,1.0); }'
  });
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(2900, 32, 20), m));
})();

var sun = new THREE.DirectionalLight(0xffa257, 1.45);
sun.position.set(-320, 148, 130);
sun.castShadow = true;
sun.shadow.mapSize.set(2560,2560);
var shc = sun.shadow.camera;
shc.near = 40; shc.far = 1150; shc.left = -290; shc.right = 290; shc.top = 290; shc.bottom = -290;
sun.shadow.bias = -0.0016; sun.shadow.normalBias = 1.35;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0x3c5a70, 0x2a2824, 0.62));
scene.add(new THREE.AmbientLight(0x9ab6cc, 0.16));
var fill = new THREE.DirectionalLight(0x5f88a8, 0.40); fill.position.set(190,80,-160); scene.add(fill);

// Without something to reflect, metalness renders nearly black. A painted
// equirectangular gradient — sky above, horizon, field below — is enough to make
// the stainless read as stainless, and costs nothing at runtime.
try{ (function(){
  var c = document.createElement('canvas'); c.width = 16; c.height = 128;
  var g = c.getContext('2d');
  var grad = g.createLinearGradient(0, 0, 0, 128);
  grad.addColorStop(0.00, '#111c31');
  grad.addColorStop(0.38, '#3d5c6b');
  grad.addColorStop(0.50, '#e2955f');
  grad.addColorStop(0.56, '#2a3a3e');
  grad.addColorStop(1.00, '#1d2326');
  g.fillStyle = grad; g.fillRect(0, 0, 16, 128);
  g.fillStyle = 'rgba(255,246,228,0.95)'; g.fillRect(0, 22, 16, 7);   // sun band
  var env = new THREE.CanvasTexture(c);
  env.mapping = THREE.EquirectangularReflectionMapping;
  env.encoding = THREE.sRGBEncoding;
  scene.environment = env;
})(); } catch(e){ /* metals fall back to lit-only shading */ }

/* ============================================================
   1. BRAND — edit this first
   ============================================================ */
/* Partner artwork, inlined — a published page cannot load remote images.
   Auctor: cream background keyed to alpha. Hertzfeld: the SVG itself, so it

      var img = document.createElement('img');

      bar.appendChild(img);

  var b = document.querySelector('#plate b'); if (b) b.textContent = BRAND.title;

  if (plate){

      var s = document.createElement('span'); s.textContent = l; plate.appendChild(s);
    });
  }
})();

function M(hex, metal, rough){ return new THREE.MeshStandardMaterial({color:hex, metalness:metal, roughness:rough}); }
// --- palette: Salt & Ink -------------------------------------------------
// Deliberately warm: bone equipment, limestone paving, graphite steel, indigo
// trim, brass secondary. The one cool colour on the whole site is the aqua a
// unit turns when it is selected, so the highlight never competes with anything.
function REPAINT(P){ Object.keys(P).forEach(function(k){
  var m = MAT[k]; if (!m) return; var v = P[k];
  m.color.setHex(v[0]);
  if (v.length > 1) m.metalness = v[1];
  if (v.length > 2) m.roughness = v[2];
});}

/* --- and the things that are lit ------------------------------------- */
function EM(base, glow, i, rough){
  return new THREE.MeshStandardMaterial({color:base, metalness:0.0, roughness:rough||0.5,
    emissive:new THREE.Color(glow), emissiveIntensity:i});
}
MAT.win   = EM(0x2b2130, 0xffc98a, 1.45);        // an occupied building
MAT.lampG = EM(0x2b2620, 0xffd8a4, 2.30, 0.40);  // mast and street lamp heads
MAT.avio  = EM(0x3a1212, 0xff3324, 2.40, 0.40);  // aviation lights on the tall stacks
MAT.lampW.emissive.setHex(0xfff1d4); MAT.lampW.emissiveIntensity = 1.70;

// Trim bands, windows, louvres and decals all sit within a few centimetres of
// the surface they dress. Nudging them toward the camera in depth kills the
// flicker outright, and it survives the per-unit material cloning the highlight does.
[MAT.accentG, MAT.accentA, MAT.win, MAT.glass, MAT.louvre, MAT.line, MAT_LOGO]
  .forEach(function(m){

// wrapped around a vertical tank shell, facing +z (the road and the rail)
function tankLogo(x, z, r, y, arcWidth){
  if (!logoOK()) return null;
  var th = arcWidth / r;                        // arc -> radians
  var h  = arcWidth / LOGO_ASPECT;
  // one panel toward the road and rail, one on the opposite face for the fly-in
  [0, Math.PI].forEach(function(face){
    var g = new THREE.CylinderGeometry(r*1.03, r*1.03, h, 44, 1, true, face - th/2, th);
    var m = new THREE.Mesh(g, MAT_LOGO);
    m.position.set(x, y, z); m.castShadow = false; m.receiveShadow = true;
    plant.add(m);
  });
  return true;
}
// flat decal on the flank of a tank car (the barrel is straight along its length)
function carLogo(parent, r, w){

var UNITS = {}, CU = null;
function beginUnit(n){ CU = n; if(n && !UNITS[n]) UNITS[n] = []; }

var G = {};
function cyl(rt,rb,h,seg,open){ seg = Math.max(10, Math.round((seg||16)*1.7)); var k='c'+rt+'_'+rb+'_'+h+'_'+seg+'_'+(open?1:0); if(!G[k]) G[k]=new THREE.CylinderGeometry(rt,rb,h,seg,1,!!open); return G[k]; }
function box(w,h,d){ var k='b'+w+'_'+h+'_'+d; if(!G[k]) G[k]=new THREE.BoxGeometry(w,h,d); return G[k]; }
function dome(r,seg){ seg = Math.max(12, Math.round((seg||16)*1.7)); var k='d'+r+'_'+seg; if(!G[k]) G[k]=new THREE.SphereGeometry(r,seg,Math.max(6,seg>>1),0,Math.PI*2,0,Math.PI/2); return G[k]; }
function mesh(geo,mat,x,y,z){

}

function platform(parent, r, y){
  var g = new THREE.Group(); g.position.y = y;
  g.add(mesh(cyl(r,r,0.16,26,false), MAT.grate, 0,0,0));
  var n = Math.max(12, Math.round(r*3));
  for (var i=0;i<n;i++){
    var a=i/n*Math.PI*2;
    var p = mesh(box(0.07,1.05,0.07), MAT.struct, Math.cos(a)*(r-0.12), 0.55, Math.sin(a)*(r-0.12));
    p.castShadow=false; g.add(p);
  }
  [0.5,1.02].forEach(function(hy){
    var ring=new THREE.Mesh(new THREE.TorusGeometry(r-0.12,0.035,6,40), MAT.struct);
    ring.rotation.x=Math.PI/2; ring.position.y=hy; ring.castShadow=false; reg(ring); g.add(ring);
  });
  parent.add(g);
}
function ladder(parent,x,z,y0,y1){
  var h=y1-y0; if(h<1) return;
  var g=new THREE.Group(); g.position.set(x,y0,z);
  [-0.26,0.26].forEach(function(sx){
    var s=mesh(box(0.06,h,0.06), MAT.struct, sx, h/2, 0); s.castShadow=false; g.add(s);
  });
  for (var y=1.2;y<h;y+=1.6){
    var c=new THREE.Mesh(new THREE.TorusGeometry(0.42,0.028,6,16,Math.PI), MAT.struct);
    c.position.set(0,y,0); c.rotation.y=Math.PI/2; c.rotation.z=Math.PI/2;
    c.castShadow=false; reg(c); g.add(c);
  }
  parent.add(g);
}
// switchback stair tower serving a set of platform levels
function stairTower(x, z, levels, w, to, bridgeAt){
  var keep = CU; CU = null;
  w = w || 2.8;
  var top = levels[levels.length-1];
  var g = new THREE.Group(); g.position.set(x,0,z);
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(function(c){
    g.add(mesh(box(0.24, top, 0.24), MAT.struct, c[0]*w/2, top/2, c[1]*w/2));
  });
  var prev = 0;
  levels.forEach(function(ly, i){
    g.add(mesh(box(w, 0.14, w), MAT.grate, 0, ly, 0));            // landing
    [-1,1].forEach(function(sx){                                   // landing rail
      var r = mesh(box(0.05, 1.05, w), MAT.struct, sx*w/2, ly+0.55, 0);
      r.castShadow=false; g.add(r);
    });
    var rise = ly - prev;
    if (rise > 0.8){
      var runL = rise*1.15, dir = (i%2===0) ? -1 : 1;
      var L = Math.sqrt(rise*rise + runL*runL);
      var fl = mesh(box(1.25, 0.14, L), MAT.grate, 0, prev+rise/2, dir*(w/2 + runL/2));
      fl.rotation.x = dir * Math.atan2(rise, runL);
      g.add(fl);
      [-1,1].forEach(function(sx){
        var hr = mesh(box(0.05, 0.05, L), MAT.struct, sx*0.6, prev+rise/2+0.95, dir*(w/2 + runL/2));
        hr.rotation.x = dir * Math.atan2(rise, runL); hr.castShadow=false; g.add(hr);
      });
    }
    prev = ly;
  });
  if (to){
    var dx = to[0]-x, dz = to[1]-z, horiz = Math.sqrt(dx*dx+dz*dz);
    var span = horiz - (to[2]||0) - w/2, ang = Math.atan2(dx, dz);
    var want = bridgeAt || [levels[levels.length-1]];
    if (span > 0.05) want.forEach(function(ly){
      var bg = new THREE.Group();
      bg.position.set(Math.sin(ang)*(w/2+span/2), ly, Math.cos(ang)*(w/2+span/2));
      bg.rotation.y = ang;
      bg.add(mesh(box(1.25, 0.14, span+0.35), MAT.grate, 0, 0, 0));
      [-1,1].forEach(function(sx){
        var hr = mesh(box(0.05, 1.05, span+0.35), MAT.struct, sx*0.62, 0.55, 0);
        hr.castShadow = false; bg.add(hr);
      });
      g.add(bg);
    });
  }
  plant.add(g);
  CU = keep;
}
function vessel(x,z,d,h,mat,opt){
  opt=opt||{};
  var g=new THREE.Group(); g.position.set(x,0,z);
  var r=d/2, skirt=opt.skirt===undefined?1.6:opt.skirt, y0=skirt;
  if (skirt>0.01){
    g.add(mesh(cyl(r*0.94,r*0.94,skirt,24,true), MAT.steelD, 0, skirt/2, 0));
    g.add(mesh(cyl(r*1.12,r*1.12,0.45,24), MAT.conc, 0, 0.22, 0));
  }
  g.add(mesh(cyl(r,r,h,opt.seg||28), mat, 0, y0+h/2, 0));
  var dt=mesh(dome(r,opt.seg||28), mat, 0, y0+h, 0); dt.scale.y=0.52; g.add(dt);
  var db=mesh(dome(r,opt.seg||28), mat, 0, y0, 0); db.scale.y=0.52; db.rotation.x=Math.PI; g.add(db);
  (opt.plats||[]).forEach(function(p){ platform(g, r+1.25, y0+p); });
  if (opt.ladder!==false) ladder(g, 0, r+0.35, 0, y0+h);
  plant.add(g); g.userData.top = y0+h;

}
function drum(x,y,z,d,len,mat,rotY){
  var g=new THREE.Group(); g.position.set(x,y,z); g.rotation.y=rotY||0;
  var r=d/2;
  var sh=mesh(cyl(r,r,len,22), mat, 0,0,0); sh.rotation.z=Math.PI/2; g.add(sh);
  var h1=mesh(dome(r,22), mat, len/2,0,0); h1.rotation.z=-Math.PI/2; h1.scale.y=0.5; g.add(h1);
  var h2=mesh(dome(r,22), mat, -len/2,0,0); h2.rotation.z=Math.PI/2; h2.scale.y=0.5; g.add(h2);
  [1,-1].forEach(function(s){
    var f=mesh(cyl(r*1.09,r*1.09,0.24,22), MAT.steelD, s*len*0.40,0,0);
    f.rotation.z=Math.PI/2; g.add(f);
    g.add(mesh(box(0.9, Math.max(0.6,y-r*0.2), d*0.98), MAT.concD, s*len*0.30, -(y)/2+r*0.1, 0));
    g.add(mesh(cyl(r*0.16,r*0.16,r*0.9,10), MAT.steelD, s*len*0.30, r*0.85, 0));
  });
  plant.add(g); return g;
}

/* ---------- piping: every run is carried on something ---------- */
function pipe(points, radius, mat){
  var v=[];
  points.forEach(function(p){
    var n=new THREE.Vector3(p[0],p[1],p[2]);
    if (v.length && v[v.length-1].distanceToSquared(n)<1e-4) return;
    v.push(n);
  });
  if (v.length<2) return null;
  var curve=new THREE.CatmullRomCurve3(v,false,'catmullrom',0.03);
  var segs=Math.min(140, Math.max(20, Math.round(curve.getLength())));
  var m=new THREE.Mesh(new THREE.TubeGeometry(curve,Math.round(segs*1.4),radius,14,false), mat);
  m.castShadow=true; m.receiveShadow=true; reg(m); plant.add(m); return m;
}

// one support standing on grade, carrying a pipe whose centreline is at y
function post(x, z, y, axis){
  if (y < 0.7) return;
  var keep = CU; CU = null;                      // supports never join a unit highlight
  if (y < 2.7){                                  // low run: concrete sleeper
    add(mesh(axis==='z' ? box(0.55,y,1.25) : box(1.25,y,0.55), MAT.concD, x, y/2, z));
  } else {                                       // elevated run: steel bent
    add(mesh(box(0.22,y,0.22), MAT.struct, x, y/2, z));
    add(mesh(axis==='z' ? box(0.20,0.20,1.25) : box(1.25,0.20,0.20), MAT.struct, x, y, z));
  }
  CU = keep;
}
// intermediate supports along one straight horizontal leg (never leaves a gap > ~8 m)
function legPosts(x0,z0,x1,z1,y){
  var dx=x1-x0, dz=z1-z0, L=Math.sqrt(dx*dx+dz*dz);
  if (L < 4) return;
  var axis = Math.abs(dx) > Math.abs(dz) ? 'x' : 'z';
  var n = Math.max(1, Math.round(L/11));
  for (var i=1;i<=n;i++){
    var d = L*i/(n+1);
    post(x0+dx*d/L, z0+dz*d/L, y, axis);
  }
}
// a run from a to b, carried the whole way: every leg and every elbow lands on something.
// `via` sends the cross-plot leg down a clear corridor instead of straight through equipment.
function run(a, b, y, radius, mat, via){
  var sy = y - radius - 0.14;
  if (via === undefined){
    pipe([[a[0],a[1],a[2]],[a[0],y-0.30,a[2]],[a[0],y,a[2]],
          [a[0],y,b[2]],[b[0],y,b[2]],
          [b[0],y-0.30,b[2]],[b[0],b[1],b[2]]], radius, mat);
    var tZ = Math.abs(a[2]-b[2]) > 2.5, tX = Math.abs(a[0]-b[0]) > 2.5;
    if (tZ) legPosts(a[0],a[2],a[0],b[2], sy);
    if (tX) legPosts(a[0],b[2],b[0],b[2], sy);
    if (tZ && tX) post(a[0], b[2], sy, 'x');
    if (tZ && !tX) post(a[0], b[2], sy, 'z');
    if (a[1] < y-2.5 && tZ) post(a[0], a[2], sy, 'z');
    return;
  }
  pipe([[a[0],a[1],a[2]],[a[0],y-0.30,a[2]],[a[0],y,a[2]],
        [a[0],y,via],[b[0],y,via],[b[0],y,b[2]],
        [b[0],y-0.30,b[2]],[b[0],b[1],b[2]]], radius, mat);
  if (Math.abs(a[2]-via) > 2.5){ legPosts(a[0],a[2],a[0],via, sy); post(a[0],via,sy,'x'); }
  if (Math.abs(a[0]-b[0]) > 2.5)  legPosts(a[0],via,b[0],via, sy);
  if (Math.abs(b[2]-via) > 2.5){ post(b[0],via,sy,'x'); legPosts(b[0],via,b[0],b[2], sy); }
}

// portal frame for a shared rack
function bent(x,z,y,span,axis){
  var o=span/2;
  if (axis==='x'){
    add(mesh(box(0.36,y,0.36), MAT.struct, x, y/2, z-o));
    add(mesh(box(0.36,y,0.36), MAT.struct, x, y/2, z+o));
    add(mesh(box(0.32,0.32,span+0.8), MAT.struct, x, y, z));
  } else {
    add(mesh(box(0.36,y,0.36), MAT.struct, x-o, y/2, z));
    add(mesh(box(0.36,y,0.36), MAT.struct, x+o, y/2, z));
    add(mesh(box(span+0.8,0.32,0.32), MAT.struct, x, y, z));
  }
}
// shared, multi-tier rack. tiers: [{y, lines:[[offset, radius, material], ...]}]
function rack(axis, fixed, from, to, tiers, span, spacing){
  span = span||5.4; spacing = spacing||9;
  var len = to-from, mid=(from+to)/2, topY=0;
  tiers.forEach(function(t){ if (t.y>topY) topY=t.y; });
  for (var s=from; s<=to+0.01; s+=spacing){
    bent(axis==='x'?s:fixed, axis==='x'?fixed:s, topY+0.25, span, axis);
    tiers.forEach(function(t){
      if (t.y < topY-0.4){
        add(mesh(axis==='x'?box(0.26,0.26,span+0.8):box(span+0.8,0.26,0.26), MAT.struct,
                 axis==='x'?s:fixed, t.y, axis==='x'?fixed:s));
      }
    });
  }
  tiers.forEach(function(t){
    t.lines.forEach(function(l){
      var m = add(mesh(cyl(l[1],l[1],len+2,12), l[2],
        axis==='x' ? mid : fixed+l[0],
        t.y + l[1] + 0.18,
        axis==='x' ? fixed+l[0] : mid));
      if (axis==='x') m.rotation.z=Math.PI/2; else m.rotation.x=Math.PI/2;
    });
  });
}

/* ============================================================
   2. THE SITE — a sargassum-to-value facility on a tropical coast
   ------------------------------------------------------------
   x runs east, z runs north, y is up, and every number is metres.
   The sea is to the north, the public coast road to the south.
   Process flows west to east: reception, wash, dry, pyrolyse,
   recover the oil, then power, char and water on the south row.

   Clear corridors used by run()/pipe():
     z =   0   main pipe rack, x -55 .. 50   (nothing between z -8 and +8)
     x =  52   overland char conveyor, z +8 .. -60
     road crossings are spanned deliberately, with posts placed
     by hand either side rather than by legPosts().
   ============================================================ */

/* ---------- scenery kit ---------- */

// a belt conveyor that carries itself: hood, stringers and trestles to grade
function conveyor(x0,z0,y0, x1,z1,y1, w, nSup, skip){
  w = w || 1.3;
  var dx=x1-x0, dy=y1-y0, dz=z1-z0;
  var flat = Math.sqrt(dx*dx+dz*dz), L = Math.sqrt(flat*flat+dy*dy);
  if (L < 1) return;
  var g = new THREE.Group();
  g.position.set((x0+x1)/2, (y0+y1)/2, (z0+z1)/2);
  g.rotation.y = Math.atan2(dx, dz);
  var inner = new THREE.Group(); inner.rotation.x = -Math.atan2(dy, flat); g.add(inner);
  inner.add(mesh(box(w, 0.26, L), MAT.grate, 0, 0, 0));
  inner.add(mesh(box(w+0.55, 0.95, L-0.2), MAT.paint, 0, 0.66, 0));
  inner.add(mesh(box(w+0.88, 0.10, L-0.6), MAT.accentG, 0, 1.16, 0));
  [-1,1].forEach(function(s){
    inner.add(mesh(box(0.10, 0.62, L), MAT.struct, s*(w/2+0.32), -0.38, 0));
  });
  plant.add(g);
  var keep = CU; CU = null;                    // trestles are shared structure
  // nSup lets a long run choose its own bay count, so trestles can be made to
  // straddle a road rather than stand in it
  var n = nSup || Math.max(1, Math.round(flat/9));
  var dom = Math.abs(dx) > Math.abs(dz);       // which axis the run mostly follows
  for (var i=0;i<=n;i++){
    var f=i/n, py = y0+dy*f-0.5;
    if (py < 1.1) continue;
    var px = x0+dx*f, pz = z0+dz*f;
    if (skip){                                 // no trestle in the carriageway
      var c = dom ? px : pz;
      if (c > Math.min(skip[0],skip[1]) && c < Math.max(skip[0],skip[1])) continue;
    }
    var ax = dom ? 'x' : 'z';
    add(mesh(box(0.24,py,0.24), MAT.struct, px, py/2, pz));
    add(mesh(ax==='x'?box(0.9,0.18,0.18):box(0.18,0.18,0.9), MAT.struct, px, py, pz));
  }
  CU = keep;
}

// a short transfer chute or inclined screw: both ends land on equipment, so it
// needs no supports of its own
function chute(x0,y0,z0, x1,y1,z1, r){
  r = r || 0.55;
  var dx=x1-x0, dy=y1-y0, dz=z1-z0;
  var flat=Math.sqrt(dx*dx+dz*dz), L=Math.sqrt(flat*flat+dy*dy);
  if (L < 0.4) return;
  var g=new THREE.Group();
  g.position.set((x0+x1)/2,(y0+y1)/2,(z0+z1)/2);
  g.rotation.y=Math.atan2(dx,dz);
  var inner=new THREE.Group(); inner.rotation.x=-Math.atan2(dy,flat); g.add(inner);
  var m=mesh(cyl(r,r,L,10), MAT.steelD, 0,0,0); m.rotation.x=Math.PI/2; inner.add(m);
  [-1,1].forEach(function(e){
    var f=mesh(cyl(r*1.3,r*1.3,0.20,10), MAT.struct, 0,0,e*(L/2-0.15));
    f.rotation.x=Math.PI/2; inner.add(f);
  });
  plant.add(g);
}

// bucket elevator — the honest answer to a lift no belt can make. Every steep
// rise on this site goes up one of these rather than on an impossible incline.
function elevator(x, z, y0, y1, w){
  w = w || 1.7; var h = y1-y0; if (h < 1) return;
  var d = w*0.78;
  add(mesh(box(w, h, d), MAT.paint, x, y0+h/2, z));
  add(mesh(box(w+0.16, 0.5, d+0.16), MAT.accentG, x, y1-1.0, z));
  add(mesh(box(w+1.0, 1.6, d+1.0), MAT.steelD, x, y1+0.8, z));      // head housing
  add(mesh(box(w+1.2, 0.28, d+1.2), MAT.struct, x, y1+1.68, z));
  add(mesh(box(w*0.7, 1.1, d+0.5), MAT.dark, x, y0+0.7, z));        // boot
  ladder(plant, x+w/2+0.35, z, y0+1.0, y1+0.6);
}

// forced-draught air cooler; the fans turn
function finFan(x,y,z,w,d,bays,baseY){
  var g=new THREE.Group(); g.position.set(x,y,z);
  g.add(mesh(box(w, 0.75, d), MAT.steelD, 0, 0, 0));
  g.add(mesh(box(w+0.3, 0.12, d+0.3), MAT.grate, 0, 0.5, 0));
  for (var i=0;i<bays;i++){
    var fx = -w/2 + w*(i+0.5)/bays;
    g.add(mesh(cyl(d*0.40, d*0.40, 0.35, 18, true), MAT.struct, fx, -0.75, 0));
    var f=new THREE.Group(); f.position.set(fx, -0.80, 0);
    for (var b=0;b<4;b++){
      var bl=mesh(box(d*0.62, 0.06, 0.30), MAT.paint, d*0.19, 0, 0);
      var h=new THREE.Group(); h.rotation.y=b*Math.PI/2; h.add(bl); f.add(h);
    }
    g.add(f); fans.push(f);
  }
  baseY = baseY || 0;
  [-1,1].forEach(function(s){
    var lh = y - 0.4 - baseY;
    if (lh > 0.4) { var keep=CU; CU=null;
      add(mesh(box(0.22, lh, 0.22), MAT.struct, x+s*(w/2-0.6), baseY+lh/2, z-d/2+0.5));
      add(mesh(box(0.22, lh, 0.22), MAT.struct, x+s*(w/2-0.6), baseY+lh/2, z+d/2-0.5));
      CU=keep; }
  });
  plant.add(g);
}

// coastal palm — leaning trunk, drooping crown
function palm(x,z,h,lean,seed){
  var g=new THREE.Group(); g.position.set(x,0,z), g.rotation.y=seed||0;
  var segs=5, prev=0, ox=0;
  for (var i=0;i<segs;i++){
    var f=i/segs, sh=h/segs;
    ox = lean*h*0.09*f*f;
    var t=mesh(cyl(0.20-0.07*f, 0.25-0.07*f, sh*1.05, 7), MAT.palmT, ox, prev+sh/2, 0);
    t.rotation.z = -lean*0.14*f; g.add(t); prev += sh;
  }
  var crown=new THREE.Group(); crown.position.set(lean*h*0.09, h, 0); g.add(crown);
  crown.add(mesh(cyl(0.36,0.30,0.7,8), MAT.palmT, 0, 0.05, 0));
  // Positive rotation.x drops the local +Z axis; negative lifts it. Three
  // segments of increasing droop give the frond its arch instead of a straight
  // spoke: out near-level from the crown, then over, then hanging.
  var n=7;
  for (var k=0;k<n;k++){
    var arm=new THREE.Group(); arm.rotation.y = k/n*Math.PI*2 + (seed||0);
    var s1=new THREE.Group(); s1.rotation.x = 0.10 + 0.16*((k%3)/2); arm.add(s1);
    s1.add(mesh(box(0.60,0.10,2.2), MAT.frond, 0, 0, 1.15));
    var s2=new THREE.Group(); s2.position.z=2.2; s2.rotation.x=0.58; s1.add(s2);
    s2.add(mesh(box(0.48,0.09,2.0), MAT.frond2, 0, 0, 1.00));
    var s3=new THREE.Group(); s3.position.z=2.0; s3.rotation.x=0.72; s2.add(s3);
    s3.add(mesh(box(0.34,0.08,1.7), MAT.frond, 0, 0, 0.85));
    crown.add(arm);
  }
  [[0.55,-0.35,0.30],[-0.45,-0.40,-0.25],[0.10,-0.45,-0.55]].forEach(function(c){
    crown.add(mesh(cyl(0.22,0.22,0.34,7), MAT.frondD, c[0], c[1], c[2]));
  });
  plant.add(g);
}

/* ============================================================
   HIGHLIGHT
   ============================================================ */
var HL_COLOR = new THREE.Color(BRAND.highlight);
var HL_EMIT  = new THREE.Color(BRAND.highlight).multiplyScalar(0.78);
var unitState = {};
Object.keys(UNITS).forEach(function(name){
  var seen = new Map();
  UNITS[name].forEach(function(m){
    var src=m.material, cloned=seen.get(src);
    if (!cloned){
      cloned = src.clone();
      cloned.userData.base = src.color.clone();
      cloned.userData.hlTo = src.color.clone().lerp(HL_COLOR, 0.80);
      seen.set(src, cloned);
    }
    m.material = cloned;
    m.userData.unit = name;               // so a tap can resolve what was hit
  });
  unitState[name] = {mats: Array.from(seen.values()), v:0, target:0};
});
function setHighlight(name){
  // A chapter can light one unit, a set of them, or nothing at all: the two
  // chapters that describe a decision rather than a machine have no geometry.
  var grp = (name && U[name] && U[name].group) || null;
  Object.keys(unitState).forEach(function(k){
    unitState[k].target = grp ? (grp.indexOf(k) >= 0 ? 1 : 0) : ((k === name) ? 1 : 0);
  });
}
function tickHighlight(dt){
  var k = 1 - Math.exp(-dt*1.9);
  Object.keys(unitState).forEach(function(name){
    var u=unitState[name];
    if (Math.abs(u.target-u.v) < 0.0015) return;
    u.v += (u.target-u.v)*k;
    for (var i=0;i<u.mats.length;i++){
      var m=u.mats[i];
      m.color.copy(m.userData.base).lerp(m.userData.hlTo, u.v);
      m.emissive.copy(HL_EMIT).multiplyScalar(u.v*0.42);
    }
  });
}

  pellet:{ name:'Feed Conditioning & Pelletising', chip:'Pellets', kick:'05 - Feed conditioning',
    at:[4,8,28], tr:0.72, er:95,
    tour:'Dried sargassum is milled, conditioned and pelletised into a dense, consistent feed that can be stored, conveyed and accurately metered.',
    info:'Drying prepares the biomass; conditioning makes it practical to handle continuously. The dried sargassum is sized and formed into a denser, free-flowing feed before intermediate storage and controlled dosing. For the SIREN concept, pelletising provides a practical way to manage a lightweight, fibrous material and deliver it consistently into modular Biorefinery units. The exact preparation specification will be confirmed through feedstock testing and feasibility work, allowing the front-end system to be matched to the characteristics of Antigua\u0027s collected sargassum.'},

  biorefinery:{ name:'Hertzfeld Biorefinery', chip:'Biorefinery', kick:'06 - Valorisation',
    at:[40,8,26], tr:0.74, er:105,
    tour:'Prepared sargassum enters the Hertzfeld Biorefinery, where one integrated process converts the feed into bio-oil, hydrogen-rich syngas and biochar.',
    info:'This is the core valorisation step within SIREN. Conditioned sargassum is continuously converted inside the Hertzfeld Biorefinery into three principal product streams: bio-oil, hydrogen-rich syngas and biochar. The concept model uses Hertzfeld\u0027s 500 kg/h Biorefinery module as its reference building block. Multiple modules can be arranged in parallel as feedstock availability and project requirements grow. The modules shown in this model demonstrate that scalability; the final number and operating capacity for Antigua will be determined during the feasibility and engineering process.'},

  recovery:{ name:'Gas Cleaning, Condensation & Product Recovery', chip:'Recovery', kick:'07 - Product recovery',
    at:[52,10,-19], tr:0.76, er:95,
    tour:'Gas cleaning and condensation recover the liquid product and prepare the syngas, while biochar leaves the Biorefinery as a separate solid stream.',
    info:'The Biorefinery produces three different forms of value, and each requires its own recovery route. The liquid product is condensed and transferred into the bio-oil system. The hydrogen-rich syngas is cleaned and conditioned for its selected downstream use, while biochar leaves the core process separately for cooling and handling. Separating these streams allows each product to follow the pathway that creates the greatest value for the project. From this point forward, SIREN is no longer handling a single marine biomass stream - it is managing multiple products.'},

  tanks:{ name:'Bio-oil Storage', chip:'Bio-oil', kick:'08 - Storage',
    at:[106,8,32], tr:0.88, er:105,
    tour:'Recovered bio-oil moves into contained storage, creating a buffer between continuous Biorefinery production and downstream refining or offtake.',
    info:'Dedicated storage decouples continuous bio-oil production from downstream processing and market demand. It allows the Biorefinery to keep operating while the liquid product is accumulated, tested and transferred to its selected next step. Hertzfeld\u0027s 500 kg/h reference case indicates approximately 4 tonnes - around 4,000 litres - of bio-oil per day per module. These figures provide a useful reference for the concept model, while actual sargassum-specific yields and storage requirements will be established during feasibility testing and final plant design.'},

  pathway:{ name:'Bio-oil Product Pathway', chip:'Bio-oil pathway', kick:'09 - Product pathway',
    at:[116,9,-18], la:1.00, tr:1.12, er:170,
    group:['tanks','upgrading','offtake'],
    tour:'The liquid product can follow different value pathways. In SIREN, the selected route is further refining into higher-value finished fuels.',
    info:'One advantage of a modular Biorefinery is that the core unit does not have to dictate the final market. The recovered bio-oil can be connected to different downstream modules according to local demand and project economics. Hertzfeld presents oil refining as an expandable part of the Biorefinery platform, alongside other site-specific value-creation modules. For the SIREN concept shown here, the preferred liquid pathway is further upgrading into transport fuels - turning an intermediate product into a higher-value local or exportable commodity.'},

  upgrading:{ name:'Fuel Upgrading - EN 590 & EN 228', chip:'Fuel upgrading', kick:'10 - Refining',
    at:[116,12,-20], tr:0.92, er:112,
    tour:'The bio-oil is further refined into diesel- and petrol-range fuels designed around EN 590 and EN 228 product specifications.',
    info:'SIREN extends the Biorefinery beyond production of a raw bio-oil. For the selected fuel pathway, Hertzfeld\u0027s platform can be expanded with downstream modules including Oil Refining, Hydrogen Separation and the Hydration Unit. Together, the required refining configuration upgrades the recovered liquid into higher-value transport-fuel streams designed around EN 590 diesel and EN 228 petrol specifications. The precise product slate, operating configuration, blending requirements and certification route will be defined during project feasibility and engineering, based on the actual sargassum feedstock and intended market.'},

  offtake:{ name:'Local Product Use & Offtake', chip:'Offtake', kick:'11 - Local value',
    at:[116,7,-76], tr:0.94, er:88,
    tour:'Finished products create value only when they reach a market - through local fuel use, industrial customers or export.',
    info:'SIREN is designed around real product demand, not simply around producing material. Where finished transport fuels form part of the selected configuration, they can create a pathway to reduce dependence on imported fossil fuel and keep more energy value within the island economy. Other offtake structures can connect production to industrial users or export markets. The final route will depend on product specification, local regulation, infrastructure and commercial demand. The forecourt shown in the model represents one possible local-use scenario rather than a fixed requirement for every SIREN project.'},

  char:{ name:'Biochar Handling & Storage', chip:'Biochar', kick:'12 - Stable carbon',
    at:[50,9,-62], tr:0.80, er:100,
    tour:'Biochar is cooled, conditioned and stored as a carbon-rich product with pathways into durable use, storage and carbon removal.',
    info:'Biochar is one of the three principal outputs of the Hertzfeld Biorefinery. After leaving the core process it is cooled, handled and stored before testing and final use. Hertzfeld\u0027s 500 kg/h reference case shows approximately 3 tonnes of biochar per day, associated in the reference model with about 8 tonnes of CO2e stored per day. Final performance for sargassum will depend on feedstock and product qualification. Where the biochar meets the applicable requirements and enters an eligible durable pathway, it can support SIREN\u0027s carbon-removal and CO2-certificate strategy.'},

  power:{ name:'Syngas Power & Heat Recovery', chip:'Energy', kick:'13 - Syngas energy',
    at:[-28,9,-20], tr:0.72, er:100,
    tour:'Hydrogen-rich syngas supplies useful energy, while recovered heat can be returned to the dryer to reduce the plant\u0027s external energy demand.',
    info:'The gaseous Biorefinery product is a valuable energy stream. Hertzfeld identifies hydrogen-rich syngas - with reference compositions of up to approximately 44% hydrogen - for direct energy use or further processing. Its 500 kg/h reference case shows around 29 MWhth per day, or approximately 8,800 Nm3 of syngas, with electricity generation around 7 MWhe per day, approximately 300 kW reference output. In SIREN, CHP, burner or turbine modules can convert that energy into useful power and heat, with recovered heat supporting the upstream drying process.'},

  water:{ name:'Water Recovery & Effluent Treatment', chip:'Water', kick:'14 - Water management',
    at:[-136,6,-22], tr:0.96, er:105,
    tour:'Water from washing, dewatering and drying is collected and treated as one integrated system, with reuse designed in wherever practical.',
    info:'A marine biomass facility must manage water as carefully as it manages energy. Wash water, press liquor, dryer condensate and other relevant process streams are collected and directed into a coordinated treatment system. Solids can be separated and water can be recovered for reuse within the preparation process wherever technically appropriate. This reduces freshwater demand and limits uncontrolled discharge. The final treatment configuration and any permitted discharge route will be developed specifically for the Antigua site as part of the environmental, permitting and feasibility work.'},

  site:{ name:'Operations, Laboratory & Quality Control', chip:'Operations', kick:'15 - Operations',
    at:[-122,8,-76], tr:0.94, er:100,
    tour:'The control room and laboratory connect daily plant operation with feedstock quality, product specification, traceability and local workforce development.',
    info:'SIREN is intended to operate as local infrastructure. The control building, laboratory and weighbridge connect feedstock receipt with plant performance and product quality. Incoming sargassum can be checked for key characteristics such as moisture, ash and salt, while bio-oil, biochar and other product streams are monitored against their required specifications. Operating procedures, training and quality systems support a locally run facility. Traceability from incoming biomass through to finished products also provides the data foundation required for transparent reporting and downstream carbon accounting.'},

  impact:{ name:'Carbon Removal & Project Impact', chip:'Impact', kick:'16 - SIREN impact',
    at:[-3,12,-10], la:1.00, tr:1.58, er:250, wide:true,
    tour:'One recurring coastal problem becomes fuels, energy and stable carbon - creating a platform for local value and measurable climate impact.',
    info:'SIREN brings the complete system back into view. Offshore collection protects the coast. Feed preparation turns difficult marine biomass into a controlled industrial input. The Hertzfeld Biorefinery converts that feed into bio-oil, hydrogen-rich syngas and biochar, while expandable modules create fuel, power, heat and carbon-value pathways. As a reference, one 500 kg/h Hertzfeld module is shown at approximately 4 t/day bio-oil, 3 t/day biochar, 29 MWhth/day syngas, 7 MWhe/day electricity and approximately 8 tCO2e/day stored, together with MRV-ready reporting logic. Actual Antigua performance will be determined through feasibility.'}
};
var ORDER = ['harvest','reception','wash','dry','pellet','biorefinery','recovery','tanks','pathway','upgrading','offtake','char','power','water','site','impact'];

/* ============================================================
   ELEMENTS
   ============================================================ */
var capEl=document.getElementById('cap'), capH=document.getElementById('capH'),
    capP=document.getElementById('capP'), barI=document.getElementById('barI'),
    panel=document.getElementById('panel'), pName=document.getElementById('pName'),
    pKick=document.getElementById('pKick'), pBody=document.getElementById('pBody'),
    chips=document.getElementById('chips'), hint=document.getElementById('hint'),
    veil=document.getElementById('veil');

/* ============================================================
   THE FILM — one slow orbit at ~45 degrees, in from the distance
   ============================================================ */
var TOUR_DUR = 224;
var CENTER = new THREE.Vector3(-3, 10, -14);
var R_BASE = 318, EL_BASE = 45*Math.PI/180, AZ0 = 2.75;
var tourT0 = performance.now();
// #t=0.42 seeks into the film, so a chapter can be reviewed without waiting
(function(){
  var m = /(?:^|[#&])t=([0-9.]+)/.exec(location.hash || '');
  if (m){ var f = parseFloat(m[1]); if (isFinite(f)) tourT0 -= (f % 1) * TOUR_DUR * 1000; }
})();
var tLook = CENTER.clone(), tWant = CENTER.clone(), tR = R_BASE;
var chapter = -1, capTimer = null;

function tourFrame(dt){
  var t = (((performance.now() - tourT0)/1000) % TOUR_DUR) / TOUR_DUR;
  var ci = Math.min(ORDER.length-1, Math.floor(t * ORDER.length));
  setChapter(ci);
  var u = U[ORDER[ci]];

  tWant.set(u.at[0],u.at[1],u.at[2]).sub(CENTER).multiplyScalar(u.la || 0.42).add(CENTER);
  tLook.lerp(tWant, 1 - Math.exp(-dt*0.85));
  tR += (R_BASE*u.tr - tR) * (1 - Math.exp(-dt*0.75));

  var ap = 0;
  if (t < 0.16)      ap = Math.pow(1 - t/0.16, 1.9);
  else if (t > 0.92) ap = Math.pow((t - 0.92)/0.08, 1.9);
  var az = AZ0 + t*Math.PI*2;
  var el = Math.max(0.09, EL_BASE + 0.05*Math.sin(t*Math.PI*4) - 0.30*ap);
  var R  = (tR + 10*Math.sin(t*Math.PI*2)) * (1 + 2.7*ap);

  camera.position.set(
    CENTER.x + R*Math.cos(el)*Math.sin(az),
    CENTER.y + R*Math.sin(el),
    CENTER.z + R*Math.cos(el)*Math.cos(az)
  );
  camera.lookAt(tLook);
  barI.style.width = (t*100).toFixed(2) + '%';
  return {r:R, az:az, el:el};
}
function setChapter(i){
  if (i === chapter) return;
  chapter = i;
  var u = U[ORDER[i]];
  capEl.classList.remove('in'); capEl.classList.add('out');
  setHighlight(ORDER[i]);
  clearTimeout(capTimer);
  capTimer = setTimeout(function(){
    capH.textContent = u.name; capP.textContent = u.tour;
    capEl.classList.remove('out'); capEl.classList.add('in');
    capEl.classList.remove('on'); void capEl.offsetWidth; capEl.classList.add('on');
  }, 640);
}

/* ============================================================
   THE EXPLORER — orbit, pinch zoom, two-finger pan, tap to inspect
   ============================================================ */
var HOME = {r:385, az:2.62, el:0.58}, HOME_T = new THREE.Vector3(-3,11,-10);
var tgt = HOME_T.clone(), wTgt = HOME_T.clone();
var cur = {r:HOME.r, az:HOME.az, el:HOME.el};
var want = {r:HOME.r, az:HOME.az, el:HOME.el};
var R_MIN=55, R_MAX=900, EL_MIN=0.10, EL_MAX=1.36;
var IDLE_MS = 45000, lastInput = performance.now();
var camRight = new THREE.Vector3(), camFlat = new THREE.Vector3();
var ptrs = new Map(), pinchDist = 0, pinchMid = null;
var downAt = 0, downX = 0, downY = 0, moved = 0;
var mode = 'tour', selected = null;

function pts(){ var a=[]; ptrs.forEach(function(v){ a.push(v); }); return a; }
function dist(a,b){ var dx=a.x-b.x, dy=a.y-b.y; return Math.sqrt(dx*dx+dy*dy); }
function mid(a,b){ return {x:(a.x+b.x)/2, y:(a.y+b.y)/2}; }
function touched(){ lastInput = performance.now(); if (mode==='explore') hint.classList.add('gone'); }

/* ---------- mode switching ---------- */
function fade(then){
  veil.classList.add('on');
  setTimeout(function(){ then(); veil.classList.remove('on'); }, 300);
}
function toExplore(seedFromFilm, cam){
  if (mode === 'explore') return;
  mode = 'explore';
  document.body.classList.remove('mode-tour');
  document.body.classList.add('mode-explore');
  if (seedFromFilm && cam){                 // carry the film's viewpoint across, no jump
    cur.r = want.r = Math.max(R_MIN, Math.min(R_MAX, cam.r));
    cur.az = want.az = cam.az;
    cur.el = want.el = Math.max(EL_MIN, Math.min(EL_MAX, cam.el));
    tgt.copy(tLook); wTgt.copy(tLook);
  }
  hint.classList.remove('gone');
  lastInput = performance.now();
}
function toTour(){
  if (mode === 'tour') return;
  fade(function(){
    mode = 'tour';
    document.body.classList.remove('mode-explore');
    document.body.classList.add('mode-tour');
    select(null, false);
    chapter = -1;
    tourT0 = performance.now();
    tR = R_BASE; tLook.copy(CENTER); tWant.copy(CENTER);
  });
}

/* ---------- pointer input ---------- */
canvas.addEventListener('pointerdown', function(e){
  canvas.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (ptrs.size === 1){ downAt = performance.now(); downX = e.clientX; downY = e.clientY; moved = 0; }
  if (ptrs.size === 2){ var a = pts(); pinchDist = dist(a[0],a[1]); pinchMid = mid(a[0],a[1]); }
  touched();
});
canvas.addEventListener('pointermove', function(e){
  var prev = ptrs.get(e.pointerId);
  if (!prev) return;
  var dx = e.clientX - prev.x, dy = e.clientY - prev.y;
  prev.x = e.clientX; prev.y = e.clientY;
  moved += Math.abs(dx) + Math.abs(dy);

  // dragging during the film simply takes you into the explorer, from where you are
  if (mode === 'tour'){
    if (moved > 14) toExplore(true, lastCam);
    return;
  }
  if (ptrs.size === 1){
    want.az -= dx*0.0052;
    want.el  = Math.max(EL_MIN, Math.min(EL_MAX, want.el + dy*0.0040));
  } else if (ptrs.size === 2){
    var a = pts(), d = dist(a[0],a[1]), m = mid(a[0],a[1]);
    if (pinchDist > 0) want.r = Math.max(R_MIN, Math.min(R_MAX, want.r * (pinchDist/Math.max(d,1))));
    if (pinchMid){
      var pdx = m.x - pinchMid.x, pdy = m.y - pinchMid.y, sc = want.r*0.0022;
      camRight.set(Math.cos(cur.az), 0, -Math.sin(cur.az));
      camFlat.set(Math.sin(cur.az), 0, Math.cos(cur.az));
      wTgt.addScaledVector(camRight, -pdx*sc).addScaledVector(camFlat, -pdy*sc);
      wTgt.x = Math.max(-190, Math.min(170, wTgt.x));
      wTgt.z = Math.max(-140, Math.min(190, wTgt.z));
    }
    pinchDist = d; pinchMid = m;
  }
  touched();
});
canvas.addEventListener('pointerup', function(e){
  if (ptrs.size === 1 && performance.now() - downAt < 350 && moved < 12) pick(downX, downY);
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2){ pinchDist = 0; pinchMid = null; }
  touched();
});
canvas.addEventListener('pointercancel', function(e){ ptrs.delete(e.pointerId); pinchDist=0; pinchMid=null; });
canvas.addEventListener('wheel', function(e){
  e.preventDefault();
  if (mode === 'tour') toExplore(true, lastCam);
  want.r = Math.max(R_MIN, Math.min(R_MAX, want.r*(1 + e.deltaY*0.0012)));
  touched();
}, {passive:false});
window.addEventListener('dblclick', function(e){ e.preventDefault(); }, {passive:false});

/* ---------- picking ---------- */
var ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(cx, cy){
  var rect = canvas.getBoundingClientRect();
  ndc.x =  ((cx-rect.left)/rect.width )*2 - 1;
  ndc.y = -((cy-rect.top )/rect.height)*2 + 1;
  ray.setFromCamera(ndc, camera);
  var hits = ray.intersectObjects(plant.children, true);
  for (var i=0;i<hits.length;i++){
    var o = hits[i].object;
    while (o && !o.userData.unit && o !== plant) o = o.parent;
    if (o && o.userData.unit){
      // tapping a unit during the film opens it in the explorer
      if (mode === 'tour') toExplore(true, lastCam);
      select(o.userData.unit, false);
      return;
    }
  }
  if (mode === 'explore') select(null, false);
}

/* ---------- selection ---------- */
ORDER.forEach(function(key){
  var b = document.createElement('button');
  b.textContent = U[key].chip; b.dataset.unit = key;
  b.addEventListener('click', function(){ touched(); select(key, true); });
  chips.appendChild(b);
});
function select(key, fly){
  selected = key;
  setHighlight(key);
  var kids = chips.children;
  for (var i=0;i<kids.length;i++) kids[i].classList.toggle('on', kids[i].dataset.unit === key);
  if (!key){ panel.classList.add('off'); return; }
  var u = U[key];
  pKick.textContent = u.kick; pName.textContent = u.name; pBody.textContent = u.info;
  panel.classList.remove('off');
  if (fly){
    wTgt.set(u.at[0],u.at[1],u.at[2]);
    want.r = u.er;
    want.el = 0.60;
  }
}
document.getElementById('close').addEventListener('click', function(){ touched(); select(null,false); });
document.getElementById('reset').addEventListener('click', function(){
  touched(); select(null,false);
  wTgt.copy(HOME_T); want.r = HOME.r; want.el = HOME.el; want.az = HOME.az;
});
document.getElementById('toExplore').addEventListener('click', function(){ toExplore(true, lastCam); });
document.getElementById('toTour').addEventListener('click', function(){ toTour(); });
document.getElementById('full').addEventListener('click', function(){
  touched();
  var el = document.documentElement;
  if (document.fullscreenElement){ document.exitFullscreen(); return; }
  if (el.requestFullscreen) el.requestFullscreen();
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
});

/* ---------- resize and the single loop ---------- */
function resize(){
  var w=window.innerWidth, h=window.innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();

document.body.classList.add('mode-tour');
var clock = new THREE.Clock(), started = false, time = 0, lastCam = {r:R_BASE, az:AZ0, el:EL_BASE};

function frame(){
  requestAnimationFrame(frame);
  var dt = Math.min(clock.getDelta(), 0.06);
  time += dt;

  if (mode === 'tour'){
    lastCam = tourFrame(dt);
  } else {
    // left alone long enough, hand the stand back to the film
    if (performance.now() - lastInput > IDLE_MS) toTour();
    var e = 1 - Math.exp(-dt*3.2);
    cur.r  += (want.r  - cur.r )*e;
    cur.az += (want.az - cur.az)*e;
    cur.el += (want.el - cur.el)*e;
    tgt.lerp(wTgt, e);
    camera.position.set(
      tgt.x + cur.r*Math.cos(cur.el)*Math.sin(cur.az),
      tgt.y + cur.r*Math.sin(cur.el),
      tgt.z + cur.r*Math.cos(cur.el)*Math.cos(cur.az)
    );
    camera.lookAt(tgt);
  }

  tickHighlight(dt);
  for (var i=0;i<fans.length;i++) fans[i].rotation.y += dt*2.4;
  if (flame){
    var f = 1 + 0.10*Math.sin(time*7.3) + 0.05*Math.sin(time*17.1);
    flame.scale.set(1,f,1);
    flame.material.opacity = 0.62 + 0.12*Math.sin(time*11.0);
    flame.userData.core.scale.set(1,1/f,1);
  }

  renderer.render(scene, camera);
  if (!started){
    started = true;
    boot.classList.add('gone');
    setTimeout(function(){ boot.style.display='none'; }, 800);
  }
}
frame();
})();
</script>
</body>
